<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Melisa Admin 🎀</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .admin-wrap {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 25px 14px 40px;
    }

    .admin-title {
      text-align: center;
      color: #e64d99;
      font-size: 28px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 12px;
      color: #63304d;
      font-size: 14px;
      font-weight: 800;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 6px;
      border: 2px solid #f2c2da;
      border-radius: 13px;
      background: #fff;
      color: #63304d;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #ed72aa;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 12px 17px;
      margin: 12px 5px 0 0;
      color: white;
      background: linear-gradient(135deg, #ff6eaf, #bd86ff);
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    button.danger {
      background: #d94c75;
    }

    button.gray {
      background: #92778a;
    }

    .admin-label {
      margin-bottom: 15px;
      color: #e34d96;
      font-size: 14px;
      font-weight: 900;
      text-align: center;
    }

    .game-row {
      margin: 10px 0;
      padding: 14px;
      border: 2px solid #f3cade;
      border-radius: 17px;
      background: #fff4fa;
    }

    .game-row-grid {
      display: grid;
      grid-template-columns: 65px 1fr;
      gap: 8px;
    }

    .game-row .emoji {
      text-align: center;
    }

    .game-row .name {
      min-width: 0;
    }

    .delete {
      width: 100%;
      margin-top: 8px;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      color: #63304d;
      font-size: 14px;
      font-weight: 800;
    }

    .check input {
      width: auto;
      margin: 0;
    }

    .hidden {
      display: none !important;
    }

    .info {
      margin-top: 10px;
      padding: 12px;
      border-radius: 12px;
      background: #fff4fa;
      color: #795d6e;
      font-size: 13px;
      line-height: 1.5;
    }

    #uid {
      display: block;
      margin-top: 8px;
      padding: 10px;
      border-radius: 10px;
      background: #fff0f7;
      color: #bd3f79;
      word-break: break-all;
    }

    #loginMsg,
    #msg {
      min-height: 24px;
      margin-top: 10px;
      color: #c23f79;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
    }

    .hint {
      color: #795d6e;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 500px) {
      .admin-title {
        font-size: 23px;
      }

      .game-row-grid {
        grid-template-columns: 55px 1fr;
      }

      button {
        width: 100%;
        margin-right: 0;
      }
    }
  </style>
</head>

<body>

  <div class="hearts">
    💗　♡　💗　♡　💗　♡
  </div>

  <div class="admin-wrap">

    <h1 class="admin-title">
      🎀 Melisa Admin Paneli
    </h1>


    <!-- GİRİŞ -->
    <section id="loginCard" class="card">

      <div class="admin-label">
        🔐 ADMİN GİRİŞİ
      </div>

      <label for="email">
        E-posta
      </label>

      <input
        id="email"
        type="email"
        placeholder="Melisa'nın e-postası"
      >

      <label for="password">
        Şifre
      </label>

      <input
        id="password"
        type="password"
        placeholder="Şifre"
      >

      <button id="loginBtn">
        🔐 Giriş Yap
      </button>

      <div id="loginMsg"></div>

    </section>


    <!-- ADMİN PANELİ -->
    <section id="panel" class="hidden">


      <!-- YAYIN BİLGİLERİ -->
      <section class="card">

        <div class="admin-label">
          📅 YAYIN BİLGİLERİ
        </div>

        <label for="date">
          Yayın Tarihi
        </label>

        <input
          id="date"
          type="date"
        >

        <label for="time">
          Yayın Saati
        </label>

        <input
          id="time"
          type="time"
        >

        <button id="saveBtn">
          💾 Kaydet
        </button>

        <button
          id="logoutBtn"
          class="gray"
        >
          🚪 Çıkış Yap
        </button>

        <div id="msg"></div>

      </section>


      <!-- OYUNLAR -->
      <section class="card">

        <div class="admin-label">
          🎮 OYUN SEÇENEKLERİ
        </div>

        <div id="games"></div>

        <button id="addBtn">
          ➕ Oyun Ekle
        </button>

        <button id="saveGamesBtn">
          💾 Oyunları Kaydet
        </button>

      </section>


      <!-- ANKET -->
      <section class="card">

        <div class="admin-label">
          🧹 ANKET
        </div>

        <p class="hint">
          Oyları sıfırlamak mevcut tüm oy kayıtlarını siler.
        </p>

        <button
          id="resetBtn"
          class="danger"
        >
          🗑️ Oyları Sıfırla
        </button>

      </section>


      <!-- UID -->
      <section class="card">

        <div class="admin-label">
          ℹ️ ADMİN UID
        </div>

        <div class="info">
          Firebase Auth kullanıcı UID'si:
        </div>

        <code id="uid"></code>

      </section>

    </section>

  </div>


  <script
    type="module"
    src="admin.js"
  ></script>

</body>
</html>
